<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShiftMate for Tutors</title>
  <meta name="description" content="AI co-pilot for the Learning Support Tutor's shift">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312305a'/%3E%3Cpath d='M9 17l4 4 10-10' stroke='%23f2b33d' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #142033;
  --muted: #5d6779;
  --faint: #8a93a3;
  --line: #e2e6ed;
  --brand: #12305a;
  --brand-ink: #ffffff;
  --accent: #f2b33d;
  --focus: #2f6fdb;
  --link: #1f5fbf;

  --ok: #23874f;
  --ok-bg: #e5f4ea;
  --warn: #a86a00;
  --warn-bg: #fff3d6;
  --bad: #c33c3c;
  --bad-bg: #fde8e8;
  --info: #285ea8;
  --info-bg: #e7effb;

  /* Exhibit 2 mastery colours */
  --m-mastered: #2e9d5b;
  --m-partial: #f0c548;
  --m-not-understood: #e06666;
  --m-not-covered: #2f3542;
  --m-ink-light: #ffffff;
  --m-ink-dark: #1d2330;

  /* Exhibit 3 performance bands */
  --b-pass: #36a862;
  --b-mid: #f3c94e;
  --b-low: #e05555;
  --b-none: #eef0f4;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c;
    --surface: #171e29;
    --surface-2: #1c2431;
    --ink: #e7ebf2;
    --muted: #a3adbd;
    --faint: #7b8597;
    --line: #2a3443;
    --brand: #8fb4ff;
    --brand-ink: #0f141c;
    --link: #8fb4ff;
    --ok: #5fd08f;
    --ok-bg: #173325;
    --warn: #f2c25b;
    --warn-bg: #3a2e12;
    --bad: #ff8a8a;
    --bad-bg: #3d1d1f;
    --info: #8fb4ff;
    --info-bg: #1b2a44;
    --m-not-covered: #0b0e13;
    --b-none: #222b38;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0f141c;
  --surface: #171e29;
  --surface-2: #1c2431;
  --ink: #e7ebf2;
  --muted: #a3adbd;
  --faint: #7b8597;
  --line: #2a3443;
  --brand: #8fb4ff;
  --brand-ink: #0f141c;
  --link: #8fb4ff;
  --ok: #5fd08f;
  --ok-bg: #173325;
  --warn: #f2c25b;
  --warn-bg: #3a2e12;
  --bad: #ff8a8a;
  --bad-bg: #3d1d1f;
  --info: #8fb4ff;
  --info-bg: #1b2a44;
  --m-not-covered: #0b0e13;
  --b-none: #222b38;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.faint { color: var(--faint); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- top bar & shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { color: var(--brand); display: inline-flex; }
.brand-text { display: flex; flex-direction: column; }
.brand-text strong { font-size: 16px; letter-spacing: 0.2px; }
.brand-text small { font-size: 12px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.shell {
  display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 57px);
  background: linear-gradient(to right, var(--surface) 0 239px, var(--line) 239px 240px, transparent 240px);
}
.sidenav {
  background: var(--surface);
  padding: 14px 10px;
  position: sticky; top: 57px; align-self: start; height: calc(100vh - 57px); overflow-y: auto;
}
.nav-group { margin-bottom: 14px; }
.nav-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); padding: 4px 10px 6px; }
.nav-item {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 8px; color: var(--ink); margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface-2); text-decoration: none; }
.nav-item.active { background: var(--info-bg); color: var(--ink); }
.nav-item.active .nav-time { color: var(--info); }
.nav-time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
.nav-label { display: flex; flex-direction: column; min-width: 0; }
.nav-label strong { font-size: 13.5px; font-weight: 600; }
.nav-label small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--brand); color: var(--brand-ink); font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

main { padding: 22px 26px 60px; min-width: 0; outline: none; }
main:focus, main:focus-visible { outline: none; }
.loading { color: var(--muted); padding: 40px; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head .kicker { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: var(--mono); }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 720px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- primitives ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
}
.card + .card { margin-top: 14px; }
.stats > .card, .cards > .card, .grid > .card, .paper-strip > * { margin-top: 0 !important; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.card-sub { color: var(--muted); font-size: 12.5px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); margin: 14px 0 6px; font-weight: 600; }
.section-title:first-child { margin-top: 0; }

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack > * + * { margin-top: 8px; }
.spacer { flex: 1; }
.hidden { display: none !important; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand); filter: brightness(1.12); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #1d1606; }
.btn-accent:hover { background: var(--accent); filter: brightness(1.05); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
.btn-xs { padding: 2px 8px; font-size: 12px; border-radius: 6px; }

.pill, .chip, .badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 9px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.chip { font-weight: 500; }
.badge { border: none; }
.tone-ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.tone-warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tone-bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.tone-info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.tone-dark { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--accent); } .dot.bad { background: var(--bad); } .dot.info { background: var(--info); }

input[type="text"], input[type="time"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--brand); }

.stat { padding: 12px 14px; }
.stat .num { font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 16px; }

.callout { border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.callout + .callout { margin-top: 8px; }
.callout .icon { flex: none; font-weight: 700; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.table-wrap table th:first-child, .table-wrap table td:first-child { padding-left: 10px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- mastery & bands ---------- */
.m-mastered { background: var(--m-mastered); color: var(--m-ink-light); }
.m-partial { background: var(--m-partial); color: var(--m-ink-dark); }
.m-not_understood { background: var(--m-not-understood); color: var(--m-ink-light); }
.m-not_covered { background: var(--m-not-covered); color: #c9cfda; }
.mchip { display: inline-flex; align-items: center; border-radius: 5px; padding: 1px 7px; font-size: 12px; font-weight: 600; font-family: var(--mono); }
.arrow { color: var(--faint); margin: 0 4px; }

.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--b-none); }
.bar > span { display: block; height: 100%; }

.b-pass { background: var(--b-pass); color: #fff; }
.b-mid { background: var(--b-mid); color: #2a2208; }
.b-low { background: var(--b-low); color: #fff; }
.b-none { background: var(--b-none); color: var(--faint); }

.oc { font-family: var(--mono); font-weight: 700; font-size: 12px; }
.oc-DONE { color: var(--ok); } .oc-W { color: var(--bad); } .oc-C { color: var(--warn); } .oc-BLANK { color: var(--faint); }

/* ---------- briefing ---------- */
.lesson-card .who { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.lesson-card .time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lesson-card .name { font-size: 16px; font-weight: 700; }
.lesson-card.is-leave { opacity: 0.6; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.list { margin: 0; padding-left: 18px; }
.list li + li { margin-top: 3px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------- inbox ---------- */
.inbox { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
.msg-list { padding: 6px; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow-y: auto; }
.msg-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 10px; border-radius: 8px; cursor: pointer; font: inherit; color: inherit; }
.msg-item:hover { background: var(--surface-2); }
.msg-item.active { background: var(--info-bg); border-color: var(--info-bg); }
.msg-item .preview { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.msg-item .meta { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.msg-item.is-sent { opacity: 0.6; }
.bubble { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 12px 14px; font-size: 15px; white-space: pre-wrap; }
.bubble.out { background: var(--ok-bg); border-color: transparent; border-radius: 12px 12px 4px 12px; }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.conf .bar { width: 70px; height: 6px; }
.conf .bar span { background: var(--brand); }
.sent-to-ai { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; max-height: 240px; overflow: auto; }
details > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; padding: 4px 0; }
details[open] > summary { margin-bottom: 6px; }

/* ---------- marking ---------- */
.marking { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.paper-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; align-items: stretch; }
.paper-item { display: block; flex: 0 0 auto; min-width: 210px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; font: inherit; color: inherit; box-shadow: var(--shadow); }
.paper-item.done { box-shadow: none; background: var(--surface-2); cursor: default; }
.pad-table td.pt { max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paper-item:hover { border-color: var(--faint); }
.paper-item.active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.pad-table td, .pad-table th { padding: 5px 6px; vertical-align: middle; }
.pad-table tr.focused td { background: var(--info-bg); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 5px 9px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--muted); min-width: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--surface-2); }
.seg button.on-DONE { background: var(--ok); color: #fff; }
.seg button.on-W { background: var(--bad); color: #fff; }
.seg button.on-C { background: var(--accent); color: #2a1d02; }
.seg button.on-BLANK { background: var(--m-not-covered); color: #fff; }
.pm { width: 56px !important; padding: 4px 6px !important; }
.score-big { display: flex; align-items: baseline; gap: 10px; }
.score-big .num { font-size: 30px; font-weight: 800; }
.diff-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.diff-row .dr-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff-row .dr-chips { white-space: nowrap; }
.diff-row .dr-reason { grid-column: 2 / -1; font-size: 12px; color: var(--faint); }
.diff-row.unchanged .dr-title { color: var(--faint); }
.diff-row:last-child { border-bottom: none; }
.diff-row.unchanged { color: var(--faint); }
.exhibit-tag { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--brand); background: var(--info-bg); border-radius: 4px; padding: 1px 6px; }
.radio-list label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
.radio-list label.suggested { border-color: var(--brand); }
.radio-list input { margin-top: 3px; accent-color: var(--brand); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }

/* ---------- records ---------- */
.heat { display: flex; flex-direction: column; gap: 6px; }
.heat-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; }
.heat-row .mod { font-size: 12.5px; }
.heat-cells { display: flex; flex-wrap: wrap; gap: 3px; }
.heat-cell { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 3px 5px; border-radius: 4px; min-width: 38px; text-align: center; cursor: default; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.x3 th, .x3 td { text-align: center; padding: 4px 2px; font-size: 11.5px; min-width: 27px; }
.x3 td.name, .x3 th.name { text-align: left; min-width: 120px; padding-left: 10px; }
.x3 .cls td { background: var(--surface-2); font-weight: 700; text-align: left; }
.x3 td.att { font-weight: 700; font-variant-numeric: tabular-nums; }
.student-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.student-tabs a { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; }
.student-tabs a.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.student-tabs a:hover { text-decoration: none; }
.chart { width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid-line { stroke: var(--line); }
.chart .line-score { stroke: var(--brand); fill: none; stroke-width: 2.5; }
.chart .line-time { stroke: var(--accent); fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
.chart .pt-score { fill: var(--brand); }
.chart .pt-time { fill: var(--accent); }

/* ---------- report ---------- */
.report-text { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.stamp { display: inline-flex; flex-direction: column; border: 2px solid var(--ok); color: var(--ok); border-radius: 8px; padding: 8px 14px; transform: rotate(-2deg); font-weight: 700; }

/* ---------- impact ---------- */
.impact-table input { width: 70px; padding: 4px 6px; text-align: right; }
.big-number { font-size: 40px; font-weight: 800; line-height: 1; }
.meter { height: 14px; border-radius: 7px; background: var(--b-none); overflow: hidden; display: flex; }
.meter span { display: block; height: 100%; }

/* ---------- toasts & modal ---------- */
.toasts { position: fixed; right: 18px; top: calc(68px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 380px; font-size: 13.5px; animation: pop 0.18s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal { border: none; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.modal::backdrop { background: rgba(10, 16, 28, 0.45); }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .marking { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; background: none; }
  .sidenav { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; }
  .nav-group { display: contents; }
  .nav-title { display: none; }
  .nav-item { grid-template-columns: auto auto; flex: none; }
  .nav-item .nav-time { display: none; }
  .nav-label small { display: none; }
  .inbox, .marking, .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .msg-list { position: static; max-height: 340px; }
  .heat-row { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  main { padding: 16px 16px 48px; }
  .topbar { padding: 10px 16px; }
  .brand-text small { display: none; }
  .cards { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 96px 1fr; }
}

/* ---------- overview ---------- */
.ov-hero { padding: 18px 0 8px; max-width: 900px; }
.ov-hero .kicker { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ov-title { font-size: clamp(30px, 4.4vw, 52px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-top: 10px; text-wrap: balance; }
.ov-title span { color: var(--ok); }
.ov-lead { font-size: 17px; color: var(--muted); margin-top: 14px; max-width: 62ch; line-height: 1.5; }
.ov-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 26px 0 8px; }
.ov-stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; box-shadow: var(--shadow); }
.ov-stat span:last-child { color: var(--muted); font-size: 13px; }
.ov-num { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.ov-section { margin-top: 34px; }
.ov-section h2 { font-size: 19px; margin-bottom: 12px; }
.ov-sub { margin: -8px 0 14px; }
.ov-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ov-side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.ov-side.ov-new { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
.ov-side-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ov-paper { font-family: var(--mono); font-size: 15px; font-weight: 700; padding: 10px 12px; border: 1px dashed var(--faint); border-radius: 8px; background: var(--surface-2); text-align: center; letter-spacing: 0.04em; }
.ov-arrow { text-align: center; color: var(--muted); font-size: 12.5px; }
.ov-sheets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ov-sheets-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ov-sheet { display: flex; flex-direction: column; gap: 3px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bad-bg); min-width: 0; }
.ov-sheet.ok { background: var(--ok-bg); }
.ov-sheet strong { font-size: 13px; }
.ov-sheet small { font-size: 11.5px; }
.ov-sheet .exhibit-tag { align-self: flex-start; }
.ov-foot { font-size: 13px; color: var(--muted); }
.ov-rules, .ov-roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ov-rule { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.ov-rule p, .ov-role p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.ov-mark { flex: none; width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; font-weight: 800; background: var(--surface-2); border: 1px solid var(--line); }
.ov-role { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tl { position: relative; padding-bottom: 22px; }
.tl-bar { position: relative; height: 34px; border-radius: 8px; background: var(--b-none); }
.tl-seg { position: absolute; top: 0; bottom: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; text-decoration: none; min-width: 22px; }
.tl-seg:hover { filter: brightness(1.1); text-decoration: none; }
.tl-p1 { background: #6b7a90; } .tl-p2 { background: #2f6fdb; } .tl-p3 { background: #d98a1c; } .tl-p4 { background: #2e9d5b; } .tl-p5 { background: #8a4fd1; }
.tl-ticks { position: relative; height: 18px; margin-top: 4px; }
.tl-ticks span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--faint); }
.tl-ticks span:first-child { transform: none; }
.tl-ticks span:last-child { transform: translateX(-100%); }
.tl-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tl-card { display: flex; flex-direction: column; gap: 3px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); min-width: 0; }
.tl-card:hover { border-color: var(--faint); text-decoration: none; }
.tl-num { width: 22px; height: 22px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
.tl-card .mono { font-size: 11px; }
.tl-screen { color: var(--link); font-size: 12.5px; font-weight: 600; margin-top: 2px; }
@media (max-width: 1100px) {
  .ov-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .ov-compare, .ov-rules, .ov-roles { grid-template-columns: 1fr; }
  .ov-sheets, .ov-sheets-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tl-seg span { display: none; }
}

/* ---------- mark once: summary strip, mini heat-map, sticky actions ---------- */
.mk-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.mk-strip .chip { font-size: 12.5px; padding: 4px 10px; }
.mini-heat { display: grid; gap: 3px; margin-top: 10px; }
.mini-heat .mh-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: center; }
.mini-heat .mh-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.mini-heat .mh-cells { display: grid; gap: 2px; }
.mini-heat .mh-cell { height: 20px; border-radius: 3px; }
.mini-heat .mh-id { font-family: var(--mono); font-size: 9.5px; color: var(--faint); text-align: center; overflow: hidden; white-space: nowrap; }
.mini-heat .mh-cell.changed { outline: 2px solid var(--focus); outline-offset: 1px; }
.sticky-actions { position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 2px; margin-top: 14px; border-top: 1px solid var(--line); z-index: 2; }

/* ---------- on site ---------- */
.sac-rows { display: grid; gap: 6px; }
.sac-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.sac-name { min-width: 0; }

        <h2>When the AI is wrong</h2>
        <ul class="list" style="margin-top:8px">
          <li><strong>Wrong category:</strong> the tutor re-categorises in one click; the rules rebuild the draft and actions.</li>
          <li><strong>A made-up number:</strong> the fact check flags any percentage in a draft that is not in the records.</li>
          <li><strong>AI and rules disagree:</strong> the draft is flagged for a closer look.</li>
          <li><strong>A date read wrongly</strong> ("下周四"): shown as a date to confirm, never silently saved.</li>
          <li><strong>API down or request declined:</strong> drafts fall back to the rules engine and the screen says so.</li>
        </ul>
      </section>
    </div>

    <section class="card" style="margin-top:14px">
      <h2>Pilot plan: four weeks, current tools</h2>
      <div class="grid grid-2" style="margin-top:8px">

          <li><strong>Week 1:</strong> one tutor uses the briefing, inbox drafts and mark-once screen; CSV export pasted into the existing sheets.</li>
          <li><strong>Week 2:</strong> the Google Sheets add-on (Apps Script, in this repo) writes the three tabs directly.</li>
          <li><strong>Weeks 3-4:</strong> measure minutes per task and the override rate; the manager decides go or no-go.</li>
        </ul>
        <ul class="list">
          <li><strong>Risk:</strong> Work WeChat cannot be auto-sent here. <strong>Fallback:</strong> copy and paste by design; WeCom API later.</li>
          <li><strong>Risk:</strong> each centre's sheets differ. <strong>Fallback:</strong> column mapping in the add-on, CSV export.</li>
          <li><strong>Risk:</strong> API cost or outage. <strong>Fallback:</strong> rules mode, $0.</li>
        </ul>
      </div>
    </section>
